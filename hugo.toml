baseURL = 'https://melbz.com.au/'
languageCode = 'en-au'
title = 'MELBZ — We Know Your Suburb Better Than You Do'
theme = 'melbz'

# Permalinks
[permalinks]
  page = '/:section/:slug/'

# Taxonomies
[taxonomies]
  suburb = 'suburbs'
  vertical = 'verticals'
  author = 'authors'
  tag = 'tags'

# Minification
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

# Site-wide params
[params]
  description = "Melbourne moves fast. Venues open, close, and get replaced by another dumpling house before you've finished your flat white. MELBZ tracks all of it — 321 suburbs, thousands of venues, updated daily by 50 locals who argue about this city for a living."
  author = "MELBZ"
  tagline = "We Know Your Suburb Better Than You Do"
  social_image = "/images/melbz-og.jpg"
  twitter = "https://x.com/melbzau"
  instagram = "https://instagram.com/melbz101"

# Main navigation menu — About removed (footer only)
[menu]
[[menu.main]]
  identifier = "vibe-score"
  name = "Vibe Scores"
  url = "/vibe-score/"
  weight = 3

[[menu.main]]
  identifier = "rankings"
  name = "Rankings"
  url = "/rankings/"
  weight = 5

[[menu.main]]
  identifier = "suburbs"
  name = "Suburbs"
  url = "/suburbs/"
  weight = 10

[[menu.main]]
  identifier = "food"
  name = "Food"
  url = "/food/"
  weight = 20

[[menu.main]]
  identifier = "nightlife"
  name = "Nightlife"
  url = "/nightlife/"
  weight = 30

[[menu.main]]
  identifier = "property"
  name = "Property"
  url = "/property/"
  weight = 40

[[menu.main]]
  identifier = "events"
  name = "Events"
  url = "/events/"
  weight = 50

[[menu.main]]
  identifier = "contact"
  name = "Contact"
  url = "/contact/"
  weight = 60

# Footer menu
[[menu.footer]]
  name = "About"
  url = "/about/"
  weight = 10

[[menu.footer]]
  name = "Contact"
  url = "/contact/"
  weight = 20

[[menu.footer]]
  name = "Privacy"
  url = "/privacy/"
  weight = 30

[[menu.footer]]
  name = "Terms"
  url = "/terms/"
  weight = 40

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# Output formats
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
