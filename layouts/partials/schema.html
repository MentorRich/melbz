{{/* JSON-LD Schema markup */}}
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "description": "{{ .Site.Params.description }}",
  "url": "{{ .Site.BaseURL }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ .Site.BaseURL }}search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  },
  "publisher": {
    "@type": "Organization",
    "name": "MELBZ",
    "url": "{{ .Site.BaseURL }}"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "MELBZ",
  "alternateName": "MELBZ - We Know Your Suburb Better Than You Do",
  "url": "https://melbz.com.au",
  "logo": {
    "@type": "ImageObject",
    "url": "https://melbz.com.au/images/melbz-og.jpg",
    "width": 600,
    "height": 60
  },
  "sameAs": [
    "https://x.com/melbzau",
    "https://instagram.com/melbz101"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "email": "hq@melbz.com.au",
    "contactType": "customer service"
  },
  "description": "{{ .Site.Params.description }}",
  "foundingDate": "2024",
  "areaServed": {
    "@type": "City",
    "name": "Melbourne",
    "containedInPlace": {
      "@type": "State",
      "name": "Victoria",
      "containedInPlace": {
        "@type": "Country",
        "name": "Australia"
      }
    }
  }
}
</script>
{{ else if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ if .Description }}{{ .Description }}{{ else }}{{ .Summary | plainify | truncate 160 }}{{ end }}",
  {{ if .Params.cover_image }}
  "image": "{{ .Params.cover_image | absURL }}",
  {{ end }}
  "author": {
    "@type": "Person",
    "name": "{{ if .Params.author }}{{ .Params.author }}{{ else }}MELBZ{{ end }}"
    {{ if .Params.author }}
    ,"url": "{{ .Site.BaseURL }}authors/{{ .Params.author | urlize }}/"
    {{ end }}
  },
  "publisher": {
    "@type": "Organization",
    "name": "MELBZ",
    "url": "{{ .Site.BaseURL }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ .Site.BaseURL }}images/melbz-og.jpg"
    }
  },
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ if .Lastmod }}{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}{{ else }}{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}{{ end }}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink }}"
  },
  "url": "{{ .Permalink }}"
  {{ if .Params.suburb }},
  "about": {
    "@type": "Place",
    "name": "{{ .Params.suburb | title }}, Melbourne, Victoria, Australia"
  }
  {{ end }}
}
</script>
{{ else if eq .Section "authors" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ .Title }}",
  "url": "{{ .Permalink }}",
  "worksFor": {
    "@type": "Organization",
    "name": "MELBZ",
    "url": "https://melbz.com.au"
  },
  "jobTitle": "{{ with .Params.role }}{{ . }}{{ else }}Contributor{{ end }}"
}
</script>
{{ else if .IsSection }}
{{ if .Pages }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": "{{ .Title }}",
  "description": "{{ .Description }}",
  "url": "{{ .Permalink }}",
  "numberOfItems": {{ len .Pages }},
  "itemListElement": [
    {{ range $index, $page := .Pages }}{{ if $index }},{{ end }}
    {
      "@type": "ListItem",
      "position": {{ add $index 1 }},
      "url": "{{ $page.Permalink }}",
      "name": "{{ $page.Title }}"
    }
    {{ end }}
  ]
}
</script>
{{ end }}
{{ end }}
