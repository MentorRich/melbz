<style>
:root{--accent:#ff3b3b;--bg:#0a0a0a;--card:#141414;--card-hover:#1a1a1a;--border:#222;--text:#e0e0e0;--text-muted:#888;--green:#22c55e;--amber:#f59e0b}
*,*::before,*::after{box-sizing:border-box}
.quiz-tool{max-width:720px;margin:0 auto;padding:2rem 1rem;min-height:80vh}
.quiz-tool h1{font-size:2rem;margin-bottom:0.5rem;line-height:1.2}
.quiz-tool .subtitle{color:var(--text-muted);margin-bottom:2rem;font-size:1.1rem}
.progress-bar{width:100%;height:6px;background:var(--border);border-radius:3px;margin-bottom:2rem;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.4s ease}
.progress-label{font-size:0.8rem;color:var(--text-muted);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.05em}
.question-container{position:relative;overflow:hidden;min-height:400px}
.question{position:absolute;top:0;left:0;width:100%;opacity:0;transform:translateX(60px);transition:all 0.4s ease;pointer-events:none}
.question.active{position:relative;opacity:1;transform:translateX(0);pointer-events:all}
.question.exit-left{opacity:0;transform:translateX(-60px)}
.question h2{font-size:1.4rem;margin-bottom:1.5rem;line-height:1.3;color:var(--text)}
.answer-grid{display:grid;gap:0.75rem}
.answer-tile{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;font-size:1rem;color:var(--text);line-height:1.4;transition:all 0.2s;min-height:48px;font-family:inherit}
.answer-tile:hover,.answer-tile:focus{border-color:var(--accent);background:var(--card-hover);outline:none}
.answer-tile:active{transform:scale(0.98)}
.answer-tile .letter{display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;background:var(--border);border-radius:6px;font-weight:700;font-size:0.85rem;margin-right:0.75rem;color:var(--text-muted);transition:all 0.2s;flex-shrink:0}
.answer-tile:hover .letter{background:var(--accent);color:#fff}
.results-section{display:none}
.results-section.visible{display:block}
.results-header{text-align:center;margin-bottom:2rem}
.results-header h2{font-size:1.8rem;margin-bottom:0.5rem}
.results-header p{color:var(--text-muted);font-size:1rem}
.match-card{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem;transition:border-color 0.2s}
.match-card:first-child{border-color:var(--accent)}
.match-rank{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);font-weight:700;margin-bottom:0.5rem}
.match-card:nth-child(2) .match-rank{color:var(--amber)}
.match-card:nth-child(3) .match-rank{color:var(--text-muted)}
.match-name{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem}
.match-name a{color:var(--text);text-decoration:none}
.match-name a:hover{color:var(--accent)}
.match-meta{display:flex;gap:1rem;margin-bottom:0.75rem;flex-wrap:wrap}
.vibe-badge{display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.6rem;border-radius:6px;font-size:0.8rem;font-weight:600}
.vibe-badge.green{background:rgba(34,197,94,0.15);color:var(--green)}
.vibe-badge.amber{background:rgba(245,158,11,0.15);color:var(--amber)}
.vibe-badge.red{background:rgba(255,59,59,0.15);color:var(--accent)}
.rent-estimate{font-size:0.85rem;color:var(--text-muted)}
.match-desc{font-size:1rem;color:var(--text);margin-bottom:1rem;font-style:italic;line-height:1.5}
.match-cta{display:inline-block;padding:0.6rem 1.2rem;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;text-decoration:none;font-size:0.85rem;font-weight:600;transition:all 0.2s;min-height:48px;line-height:1.6}
.match-cta:hover{background:var(--accent);color:#fff}
.share-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-top:2rem;text-align:center}
.share-section h3{font-size:1.1rem;margin-bottom:0.75rem}
.share-section p{font-size:0.9rem;color:var(--text-muted);margin-bottom:1rem}
.share-btn{display:inline-block;padding:0.7rem 1.5rem;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.95rem;min-height:48px;font-family:inherit;transition:opacity 0.2s}
.share-btn:hover{opacity:0.9}
.share-url{display:block;margin-top:0.75rem;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text-muted);font-size:0.8rem;word-break:break-all;display:none}
.extra-links{margin-top:1.5rem;display:flex;flex-direction:column;gap:0.75rem;align-items:center}
.extra-links a{color:var(--text-muted);text-decoration:none;font-size:0.9rem;transition:color 0.2s;min-height:48px;display:flex;align-items:center}
.extra-links a:hover{color:var(--accent)}
.restart-btn{display:inline-block;margin-top:2rem;padding:0.6rem 1.5rem;background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;cursor:pointer;font-size:0.9rem;font-family:inherit;min-height:48px;transition:all 0.2s}
.restart-btn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:480px){
  .quiz-tool h1{font-size:1.5rem}
  .question h2{font-size:1.2rem}
  .answer-tile{padding:0.9rem 1rem;font-size:0.95rem}
  .match-name{font-size:1.3rem}
  .match-meta{gap:0.5rem}
}
</style>

  let answers = [];
  let currentQ = 0;

  function init() {
    const params = new URLSearchParams(window.location.search);
    const r = params.get('r');
    if (r && r.length === 7 && /^[0-3]{7}$/.test(r)) {
      answers = r.split('').map(Number);
      document.getElementById('quizSection').style.display = 'none';
      showResults();
      return;
    }
    renderQuestion(0);
  }

  function renderQuestion(idx) {
    const container = document.getElementById('questionContainer');
    const q = QUESTIONS[idx];
    document.getElementById('progLabel').textContent = 'Q' + (idx + 1) + ' of 7';
    document.getElementById('progFill').style.width = ((idx + 1) / 7 * 100) + '%';

    const div = document.createElement('div');
    div.className = 'question active';
    div.innerHTML = '<h2>' + q.q + '</h2><div class="answer-grid">' +
      q.answers.map(function(a, i) {
        return '<button class="answer-tile" data-idx="' + i + '">' +
          '<span class="letter">' + String.fromCharCode(65 + i) + '</span>' + a + '</button>';
      }).join('') + '</div>';

    var prev = container.querySelector('.question.active');
    if (prev) {
      prev.classList.remove('active');
      prev.classList.add('exit-left');
      setTimeout(function() { if (prev.parentNode) prev.parentNode.removeChild(prev); }, 500);
    }
    container.appendChild(div);

    div.querySelectorAll('.answer-tile').forEach(function(btn) {
      btn.addEventListener('click', function() {
        answers[idx] = parseInt(this.getAttribute('data-idx'));
        if (idx < 6) {
          currentQ = idx + 1;
          renderQuestion(currentQ);
        } else {
          document.getElementById('quizSection').style.display = 'none';
          showResults();
        }
      });
    });
  }

  function calcScores() {
    var scores = {};
    for (var qi = 0; qi < 7; qi++) {
      var ai = answers[qi];
      var map = SCORING[qi][ai];
      if (!map) continue;
      for (var cluster in map) {
        scores[cluster] = (scores[cluster] || 0) + map[cluster];
      }
    }
    if (answers[2] === 3) {
      for (var c in scores) scores[c] = scores[c] * 1.0;
    }
    return scores;
  }

  function showResults() {
    var scores = calcScores();
    var sorted = Object.keys(scores).sort(function(a, b) { return scores[b] - scores[a]; });
    var top3 = sorted.slice(0, 3);

    var cardsHtml = '';
    var topSuburb = null;
    var rankLabels = ["\u2764\ufe0f Your top match", "\ud83e\udd48 Strong contender", "\ud83e\udd49 Worth exploring"];
    top3.forEach(function(cluster, i) {
      var suburbs = CLUSTERS[cluster];
      if (!suburbs || !suburbs.length) return;
      var pick = null;
      for (var s = 0; s < suburbs.length; s++) {
        if (SUBURB_DATA[suburbs[s]]) { pick = suburbs[s]; break; }
      }
      if (!pick) pick = suburbs[0];
      var data = SUBURB_DATA[pick] || {name: pick.replace(/-/g,' ').replace(/\b\w/g, function(l){return l.toUpperCase();}), vibe: 7, rent1br: "$350\u2013$450", desc: "A Melbourne suburb with its own story."};
      if (i === 0) topSuburb = pick;

      var vibeClass = data.vibe >= 8 ? 'green' : data.vibe >= 5 ? 'amber' : 'red';
      cardsHtml += '<div class="match-card">' +
        '<div class="match-rank">' + rankLabels[i] + '</div>' +
        '<div class="match-name"><a href="/' + pick + '/">' + data.name + '</a></div>' +
        '<div class="match-meta">' +
          '<span class="vibe-badge ' + vibeClass + '">Vibe ' + data.vibe + '/10</span>' +
          '<span class="rent-estimate">1BR: ' + data.rent1br + '/wk</span>' +
        '</div>' +
        '<div class="match-desc">\u201c' + data.desc + '\u201d</div>' +
        '<a href="/' + pick + '/" class="match-cta">Read the full guide \u2192</a>' +
      '</div>';
    });

    document.getElementById('matchCards').innerHTML = cardsHtml;

    var code = answers.join('');
    var shareLink = window.location.origin + '/tools/suburb-match/?r=' + code;
    document.getElementById('shareUrl').textContent = shareLink;

    var extraHtml = '';
    if (topSuburb) {
      extraHtml += '<a href="/confessions/">Disagree with your match? Tell us \u2192</a>';
      extraHtml += '<a href="/tools/compare-suburbs/?suburbs=' + topSuburb + '">Compare ' + (SUBURB_DATA[topSuburb]||{}).name + ' with others \u2192</a>';
    }
    document.getElementById('extraLinks').innerHTML = extraHtml;

    document.getElementById('resultsSection').classList.add('visible');
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  document.getElementById('shareBtn').addEventListener('click', function() {
    var code = answers.join('');
    var url = window.location.origin + '/tools/suburb-match/?r=' + code;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        document.getElementById('shareBtn').textContent = 'Copied!';
        setTimeout(function(){ document.getElementById('shareBtn').textContent = 'Copy share link'; }, 2000);
      });
    } else {
      document.getElementById('shareUrl').style.display = 'block';
      document.getElementById('shareUrl').textContent = url;
    }
  });

  document.getElementById('restartBtn').addEventListener('click', function() {
    answers = [];
    currentQ = 0;
    document.getElementById('resultsSection').classList.remove('visible');
    document.getElementById('quizSection').style.display = 'block';
    document.getElementById('matchCards').innerHTML = '';
    history.replaceState(null, '', window.location.pathname);
    renderQuestion(0);
  });

  init();
})();
</script>
{{ end }}
