<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-au" }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    {{- partial "head.html" . -}}
    
    <!-- Preconnect to external domains -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    
    <!-- CSS -->
    {{- $css := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">
    
    <!-- Schema.org JSON-LD -->
    {{- partial "schema.html" . -}}
</head>
<body>

    <div class="reading-progress" id="readingProgress"></div>
    <script>
    window.addEventListener('scroll', function() {
        var h = document.documentElement;
        var b = document.body;
        var st = h.scrollTop || b.scrollTop;
        var sh = h.scrollHeight || b.scrollHeight;
        var ch = h.clientHeight;
        var pct = (st / (sh - ch)) * 100;
        document.getElementById('readingProgress').style.width = pct + '%';
    });
    </script>
    <a href="#main" class="skip-link">Skip to main content</a>
    
    {{- partial "header.html" . -}}
    
    <main id="main" role="main">
        {{- block "main" . }}{{- end }}
    </main>
    
    {{- partial "footer.html" . -}}
    
    <!-- JavaScript for mobile navigation -->
    <script>
        // Mobile navigation toggle
        const navToggle = document.querySelector('.nav-toggle');
        const body = document.body;
        
        if (navToggle) {
            navToggle.addEventListener('click', function() {
                body.classList.toggle('nav-open');
            });
        }
        
        // Close mobile nav on link click
        const navLinks = document.querySelectorAll('.main-nav a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                body.classList.remove('nav-open');
            });
        });
        
        // Close mobile nav on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                body.classList.remove('nav-open');
            }
        });
    </script>
</body>
</html>
